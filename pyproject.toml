[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quant-research-dataset"
dynamic = ["version"]
description = "One API for research-grade market data across markets: equities, options, fundamentals and rates, served from a versioned Hugging Face dataset."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hardy-Z" }]
keywords = ["quant", "finance", "dataset", "crsp", "compustat", "optionmetrics", "hugging-face", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "pyarrow>=14",
    "pandas>=2.0",
    "pyyaml>=6",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
docs = ["mkdocs-material>=9.5"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "duckdb>=1.0",
]

[project.scripts]
qrd = "quant_research_dataset.cli:main"

[project.urls]
Homepage = "https://github.com/Hardy-Z/quant-research-dataset"
Issues = "https://github.com/Hardy-Z/quant-research-dataset/issues"

[tool.hatch.version]
path = "src/quant_research_dataset/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_research_dataset"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PD002"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/quant_research_dataset"]
