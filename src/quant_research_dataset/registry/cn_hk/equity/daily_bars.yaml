id: cn_hk/equity/daily_bars
title: China A-share and Hong Kong H-share daily bars
aliases: [ah_stock_daily]
market: cn_hk
asset_class: equity
frequency: daily
source: Yahoo Finance (via yfinance)
license: Yahoo Finance terms of service
publish: false
description: >
  Daily prices for the A-share and H-share lines of about 100 companies dual
  listed in Shanghai/Shenzhen and Hong Kong. Pair the two lines with
  cn_hk/equity/ah_pairs.
id_column: symbol
date_column: date
sort_by: [symbol, date]
notes:
  - "Symbols use Yahoo suffixes: .SS = Shanghai, .SZ = Shenzhen, .HK = Hong Kong."
  - "A shares are quoted in CNY and H shares in HKD; use cn_hk/fx/daily to convert."
  - "adj_close is adjusted for splits and dividends; open and close are not."
build:
  source: cross_listed/yahoo_daily.parquet
  exclude_ids: ["CNYHKD=X", "HKD=X"]
columns:
  - {name: symbol, source: ticker, type: string, description: Yahoo Finance symbol}
  - {name: date, type: date32, description: Trading date (local exchange)}
  - {name: open, type: float64, unit: local currency, description: Open}
  - {name: close, type: float64, unit: local currency, description: Close}
  - {name: adj_close, type: float64, unit: local currency, description: Close adjusted for splits and dividends}
  - {name: volume, type: float64, unit: shares, description: Volume}
