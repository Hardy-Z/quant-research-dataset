id: us/equity/ccm_link
title: CRSP/Compustat merged link table
aliases: [ccm, ccmxpf_linktable]
market: us
asset_class: equity
frequency: static
source: CRSP/Compustat Merged (CCM) database via WRDS
license: WRDS / CRSP subscription terms
description: >
  Maps Compustat companies (gvkey) to CRSP securities (permno) over time.
  Use it to join fundamentals to prices; qrd.link_crsp_compustat() applies the
  standard link filters for you.
id_column: gvkey
sort_by: [gvkey, linkdt]
notes:
  - "linkenddt is null while a link is still active (CRSP writes 'E')."
  - "Standard filter: linktype in (LC, LU) and linkprim in (P, C)."
build:
  source: WRDS_data/crsp/ccm_link_table.csv
  format: csv
  options:
    null_tokens: {LINKENDDT: ["E"]}
columns:
  - {name: gvkey, type: string, description: Compustat company key (6 digits, zero padded)}
  - {name: permno, source: LPERMNO, type: int32, description: Linked CRSP PERMNO}
  - {name: permco, source: LPERMCO, type: int32, description: Linked CRSP PERMCO}
  - {name: liid, source: LIID, type: string, description: Compustat issue id of the linked security}
  - {name: linktype, source: LINKTYPE, type: string, description: "Link type: LC=confirmed, LU=unconfirmed but usable, others are weaker"}
  - {name: linkprim, source: LINKPRIM, type: string, description: "Primary link marker: P=primary, C=primary per CRSP, J/N=secondary"}
  - {name: linkdt, source: LINKDT, type: date32, description: First date the link is valid}
  - {name: linkenddt, source: LINKENDDT, type: date32, description: Last date the link is valid (null = still active)}
  - {name: conm, type: string, description: Company name}
  - {name: tic, type: string, description: Compustat ticker}
  - {name: cusip, type: string, description: Compustat CUSIP (9 characters)}
