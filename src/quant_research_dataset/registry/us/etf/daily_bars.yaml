id: us/etf/daily_bars
title: US ETF daily bars
aliases: [us_etf_daily]
market: us
asset_class: etf
frequency: daily
source: Alpaca Markets historical stock bars (SIP feed)
license: Alpaca market data terms
publish: false
description: >
  Daily bars for liquid US ETFs (SPY, QQQ, IWM, TLT, IEF, GLD), adjusted for
  splits and dividends. Useful as benchmarks and for cross-asset studies.
id_column: symbol
date_column: date
sort_by: [symbol, date]
notes:
  - "SPY, QQQ and IWM have open and close only; high, low and volume are null for them."
  - "Prices are split and dividend adjusted, so close-to-close changes are total returns."
build:
  source: etf_daily/*_daily.csv
  format: csv
  options:
    id_from_filename: '^(?P<id>[A-Z]+)_daily\.csv$'
columns:
  - {name: symbol, type: string, description: Ticker}
  - {name: date, type: date32, description: Trading date}
  - {name: open, type: float64, unit: USD, description: Open (adjusted)}
  - {name: high, type: float64, unit: USD, description: High (adjusted)}
  - {name: low, type: float64, unit: USD, description: Low (adjusted)}
  - {name: close, type: float64, unit: USD, description: Close (adjusted)}
  - {name: volume, type: float64, unit: shares, description: Volume (adjusted)}
