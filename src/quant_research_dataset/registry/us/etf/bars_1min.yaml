id: us/etf/bars_1min
title: US ETF 1-minute bars
aliases: [etf_1min]
market: us
asset_class: etf
frequency: intraday
source: Alpaca Markets historical stock bars (SIP feed)
license: Alpaca market data terms
publish: false
description: >
  1-minute open and close for SPY, QQQ and IWM during regular trading hours
  (09:30-16:00 New York time), adjusted for splits and dividends.
id_column: symbol
date_column: timestamp
partitioning: year
sort_by: [symbol, timestamp]
notes:
  - "timestamp is the bar open time in UTC."
  - "Known gaps: QQQ has a single bar on 2018-05-02 and 2018-05-03; on 2020-03-09/12/16/18, 14 bars are missing (market-wide circuit-breaker halts)."
  - "Early-close days (day after Thanksgiving, Christmas Eve, July 3) include bars after the 13:00 close."
build:
  source: etf_intraday/SPY_QQQ_IWM_1min_*.parquet
columns:
  - {name: symbol, type: string, description: Ticker}
  - {name: timestamp, source: timestamp_utc, type: "timestamp[us, UTC]", description: Bar open time (UTC)}
  - {name: open, type: float64, unit: USD, description: Open (adjusted)}
  - {name: close, type: float64, unit: USD, description: Close (adjusted)}
