id: us/etf/bars_5min
title: US ETF 5-minute bars
aliases: [us_etf_5min]
market: us
asset_class: etf
frequency: intraday
source: Alpaca Markets historical stock bars (SIP feed)
license: Alpaca market data terms
publish: false
description: >
  5-minute OHLCV bars for SPY during regular trading hours (09:30-16:00
  New York time), adjusted for splits and dividends.
id_column: symbol
date_column: timestamp
partitioning: year
sort_by: [symbol, timestamp]
notes:
  - "timestamp is the bar open time in UTC. Convert with df.timestamp.dt.tz_convert('America/New_York')."
build:
  source: etf_intraday/*_5min.csv
  format: csv
  options:
    id_from_filename: '^(?P<id>[A-Z]+)_5min\.csv$'
    timezone: America/New_York
columns:
  - {name: symbol, type: string, description: Ticker}
  - {name: timestamp, type: "timestamp[us, UTC]", description: Bar open time (UTC)}
  - {name: open, type: float64, unit: USD, description: Open (adjusted)}
  - {name: high, type: float64, unit: USD, description: High (adjusted)}
  - {name: low, type: float64, unit: USD, description: Low (adjusted)}
  - {name: close, type: float64, unit: USD, description: Close (adjusted)}
  - {name: volume, type: float64, unit: shares, description: Volume (adjusted)}
